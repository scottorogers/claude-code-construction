# Uniclass 2015 — Systems (Ss) and Project management (PM) tables
#
# Source: NBS, https://uniclass.thenbs.com/taxon/ss and /taxon/pm
# Versions read: Systems v1.43 (July 2026); Project management v1.30 (July 2026)
# Retrieved: 2026-11-05
#
# Codes and titles below are copied from the NBS pages on that date. Only the
# groups whose child pages were read are expanded; everything else stops at
# group level. Do not add a deeper code here without reading its NBS page —
# Uniclass is revised several times a year and codes are withdrawn
# ("Not in use"). Withdrawn codes are left out.
#
# Used by:
#   scripts/classification.py  — parses section references, groups by Ss_NN
#   scripts/orchestration/nodes.py — group labels on the review agenda
#   reference/pe_expertise/     — scope_file routes a group to its checklist
#
# typical_trades and scope_file are this repo's routing aids, not part of
# Uniclass.

meta:
  publisher: "NBS"
  url: "https://uniclass.thenbs.com/"
  systems_version: "v1.43, July 2026"
  pm_version: "v1.30, July 2026"
  retrieved: "2026-11-05"
  code_format: "Table_Group_SubGroup_Section_Object, e.g. Ss_70_30_45 (Systems / Electrical / Electricity distribution / Low-voltage)"

