# UK statutory and standards framework — quick reference
#
# Retrieved: 2026-11-05. Every entry carries its source. Anything a skill
# cannot trace to a source here or in the project documents must be reported
# as unverified, never stated as fact.
#
# Status values:
#   verified — checked against the named public source on the retrieved date
#   verify   — the document exists and is relevant, but its current edition or
#              clause text is paywalled or was not checked. Cite the number only
#              and take the edition from the project specification.
#
# JURISDICTION: Building Regulations and Approved Documents below are for
# ENGLAND. Wales, Scotland and Northern Ireland have their own regimes:
#   Wales            — Building Regulations 2010 as applied in Wales, Welsh
#                      Approved Documents (diverged from England since 2011)
#   Scotland         — Building (Scotland) Regulations 2004 and the Technical
#                      Handbooks (domestic / non-domestic)
#   Northern Ireland — Building Regulations (Northern Ireland) 2012 and the
#                      Technical Booklets
# If the project is outside England, stop and say which regime applies; do not
# apply English Approved Document figures to it.

legislation:
  building_regulations:
    title: "The Building Regulations 2010"
    citation: "SI 2010/2214"
    applies: "England (and Wales as separately amended)"
    source: "https://www.legislation.gov.uk/uksi/2010/2214"
    status: verified
    key_regulations:
      "7": "Materials and workmanship. Reg. 7(2) (England): materials forming part of an external wall or specified attachment of a relevant building must be European Classification A2-s1,d0 or A1, subject to exemptions in reg. 7(3). 'Relevant building' (reg. 7(4)): a storey at least 18m above ground level (excluding roof-top plant) and containing one or more dwellings or an institution — read the full definition before applying."
      "38": "Fire safety information (to be given to the responsible person at completion)"
    key_regulations_source: "https://www.legislation.gov.uk/uksi/2010/2214/regulation/7 (read 2026-11-05)"
  building_safety_act:
    title: "Building Safety Act 2022"
    citation: "2022 c. 30"
    note: "Higher-risk building regime, Building Safety Regulator and gateway approvals. Check whether the project is a higher-risk building before applying ordinary building control routes."
    source: "https://www.legislation.gov.uk/ukpga/2022/30"
    status: verified
  cdm:
    title: "The Construction (Design and Management) Regulations 2015"
    citation: "SI 2015/51"
    source: "https://www.legislation.gov.uk/uksi/2015/51/contents"
    status: verified
    key_regulations:
      "4": "Client duties in relation to managing projects"
      "5": "Appointment of the principal designer and the principal contractor"
      "6": "Notification (particulars in Schedule 1)"
      "11": "Duties of a principal designer in relation to health and safety at the pre-construction phase"
      "12": "Construction phase plan and health and safety file"
      "13": "Duties of a principal contractor in relation to health and safety at the construction phase"
      "14": "Principal contractor's duties to consult and engage with workers"
  fire_safety_order:
    title: "The Regulatory Reform (Fire Safety) Order 2005"
    citation: "SI 2005/1541"
    note: "Applies to the building once occupied; drives fire strategy and Regulation 38 handover information."
    source: "https://www.legislation.gov.uk/uksi/2005/1541"
    status: verified
  electricity_at_work:
    title: "The Electricity at Work Regulations 1989"
    citation: "SI 1989/635"
    source: "https://www.legislation.gov.uk/uksi/1989/635"
    status: verified
  work_at_height:
    title: "The Work at Height Regulations 2005"
    citation: "SI 2005/735"
    source: "https://www.legislation.gov.uk/uksi/2005/735"
    status: verified
  construction_act:
    title: "Housing Grants, Construction and Regeneration Act 1996, Part II (as amended by the Local Democracy, Economic Development and Construction Act 2009, Part 8)"
    citation: "1996 c. 53"
    note: "Statutory payment notices, pay less notices, adjudication. Applies to JCT and NEC subcontracts alike."
    key_sections:
      "113": "Prohibition of conditional payment provisions — pay-when-paid has no effect, except where the third party (or a person whose payment is a condition of the third party's payment) is insolvent. Source: https://www.legislation.gov.uk/ukpga/1996/53/section/113"
    source: "https://www.legislation.gov.uk/ukpga/1996/53/part/II"
    status: verified

