# Standard forms of subcontract. Product names confirmed on publisher sites.
contracts:
  jct_2024:
    publisher: "JCT (Sweet & Maxwell)"
    source: "https://corporate.jctltd.co.uk/jct-2024-edition-available-contracts/"
    status: verified
    subcontracts:
      "DBSub/A 2024": "Design and Build Sub-Contract Agreement"
      "DBSub/C 2024": "Design and Build Sub-Contract Conditions"
      "SBCSub/A 2024": "Standard Building Sub-Contract Agreement"
      "SBCSub/C 2024": "Standard Building Sub-Contract Conditions"
      "SBCSub/D/A 2024": "Standard Building Sub-Contract with Sub-Contractor's Design Agreement"
      "SBCSub/D/C 2024": "Standard Building Sub-Contract with Sub-Contractor's Design Conditions"
    vocabulary: ["Sub-Contract Sum", "Sub-Contract Works", "Variation", "Relevant Event", "Relevant Matter", "extension of time", "Practical Completion", "Rectification Period", "retention", "Payment Notice", "Pay Less Notice"]
  nec4:
    publisher: "NEC (Thomas Telford)"
    source: "https://www.neccontract.com/products/contracts/nec4/engineering-and-construction-contract/ecs"
    status: verified
    subcontracts:
      "ECS": "NEC4 Engineering and Construction Subcontract"
      "ECSS": "NEC4 Engineering and Construction Short Subcontract"
    vocabulary: ["Subcontract Data", "Scope", "Main Option", "Secondary Options", "early warning", "compensation event", "Accepted Programme", "Defined Cost", "Price for Work Done to Date", "Completion", "defects date"]
    note: "Do not quote NEC or JCT clause numbers unless they are in the user's contract documents. Main Option and Secondary Options come from the Subcontract Data."
