# Standards. Only BS 7671's current designation was checked. For the rest,
# cite the number and take the edition (year + amendments) from the project
# specification; if the spec gives none, raise it as a query.
standards:
  "BS 7671":
    title: "Requirements for Electrical Installations — IET Wiring Regulations"
    current: "BS 7671:2018+A4:2026"
    note: "IET states the transition period for BS 7671:2018+A2:2022 ended on 15 October 2026. Design to A4 unless the contract fixes an earlier edition. Clause text is paywalled — quote regulation numbers only from the project documents or a copy the user supplies."
