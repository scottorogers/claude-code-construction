# Drawing scale factors
# UK drawings are metric. Imperial sections
# are kept below for US or legacy drawings only.
# metric factor = real length / drawing length (dimensionless)

metric:
  - notation: "1:1"
    factor: 1
    common_use: "Full-size details"
  - notation: "1:2"
    factor: 2
    common_use: "Details"
  - notation: "1:5"
    factor: 5
    common_use: "Details, joinery, containment brackets"
  - notation: "1:10"
    factor: 10
    common_use: "Details"
  - notation: "1:20"
    factor: 20
    common_use: "Details, plant room layouts, rack elevations"
  - notation: "1:50"
    factor: 50
    common_use: "General arrangement, comms room layouts"
  - notation: "1:100"
    factor: 100
    common_use: "General arrangement floor plans, containment routes"
  - notation: "1:200"
    factor: 200
    common_use: "Floor plans (large floorplates), site layouts"
  - notation: "1:250"
    factor: 250
    common_use: "Site layouts"
  - notation: "1:500"
    factor: 500
    common_use: "Site plans"
  - notation: "1:1000"
    factor: 1000
    common_use: "Site/location plans"
  - notation: "1:1250"
    factor: 1250
    common_use: "Location plans (OS)"
  - notation: "1:2500"
    factor: 2500
    common_use: "Location plans (OS)"

# Metric pixel helper:
# At a given DPI, pixels_per_real_metre = DPI / 0.0254 / factor
# Example: 1:100 at 200 DPI -> 200 / 0.0254 / 100 = 78.7 pixels per metre
# Always confirm the scale against a dimensioned line or the scale bar — PDFs
# are often printed "fit to page" (A1 drawing on A3 = half scale).

# Imperial (US / legacy) — scale_factor = real_inches / drawing_inches

architectural:
  - notation: '1/16" = 1''-0"'
    factor: 192
    one_inch_equals: "16'-0\""
    common_use: "Site plans"
  - notation: '3/32" = 1''-0"'
    factor: 128
    one_inch_equals: "10'-8\""
    common_use: "Large floor plans"
  - notation: '1/8" = 1''-0"'
    factor: 96
    one_inch_equals: "8'-0\""
    common_use: "Floor plans"
  - notation: '3/16" = 1''-0"'
    factor: 64
    one_inch_equals: "5'-4\""
    common_use: "Floor plans (detail)"
  - notation: '1/4" = 1''-0"'
    factor: 48
    one_inch_equals: "4'-0\""
    common_use: "Floor plans, elevations"
  - notation: '3/8" = 1''-0"'
    factor: 32
    one_inch_equals: "2'-8\""
    common_use: "Sections"
  - notation: '1/2" = 1''-0"'
    factor: 24
    one_inch_equals: "2'-0\""
    common_use: "Wall sections"
  - notation: '3/4" = 1''-0"'
    factor: 16
    one_inch_equals: "1'-4\""
    common_use: "Details"
  - notation: '1" = 1''-0"'
    factor: 12
    one_inch_equals: "1'-0\""
    common_use: "Details"
  - notation: '1-1/2" = 1''-0"'
    factor: 8
    one_inch_equals: "8\""
    common_use: "Large details"
  - notation: '3" = 1''-0"'
    factor: 4
    one_inch_equals: "4\""
    common_use: "Large details"
  - notation: "FULL SIZE"
    factor: 1
    one_inch_equals: "1\""
    common_use: "Full scale details"

civil:
  - notation: '1" = 10'''
    factor: 120
    common_use: "Site details"
  - notation: '1" = 20'''
    factor: 240
    common_use: "Site plans"
  - notation: '1" = 30'''
    factor: 360
    common_use: "Grading plans"
  - notation: '1" = 40'''
    factor: 480
    common_use: "Site plans"
  - notation: '1" = 50'''
    factor: 600
    common_use: "Survey / site"
  - notation: '1" = 60'''
    factor: 720
    common_use: "Large site plans"
  - notation: '1" = 100'''
    factor: 1200
    common_use: "Area plans"
  - notation: '1" = 200'''
    factor: 2400
    common_use: "Regional plans"

# Pixel calculation helper:
# At a given DPI, pixels_per_real_foot = DPI / (factor / 12)
# Example: 1/4" = 1'-0" at 200 DPI → 200 / (48/12) = 200 / 4 = 50 pixels per foot
