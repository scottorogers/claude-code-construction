  referenced_in: ["para 2.9"]
  rows:
    "up to 60 people": 1
    "up to 600 people": 2
    "more than 600 people": 3

escape_route_widths:
  table: "Table 2.3 Widths of escape routes and exits"
  referenced_in: ["para 2.18"]
  units: "mm minimum width"
  read_notes: "Table 2.3 notes 1–5 must be read before applying any figure"
  rows:
    "up to 60 people": 750
    "up to 110 people": 850
    "up to 220 people": 1050
    "more than 220 people": "5 per person"

occupant_number:
