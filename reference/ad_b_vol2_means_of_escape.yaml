  referenced_in: ["para 2.3", "para 2.6", "para 2.7", "para 3.3"]
  units: "metres"
  format: "[one direction only, more than one direction]"
  read_notes: "Table 2.1 notes 1–5 must be read before applying any figure"
  rows:
    "2(a) Residential (institutional)": [9, 18]
    "2(b) Residential (other) — in bedrooms": [9, 18]
    "2(b) Residential (other) — in bedroom corridors": [9, 35]
    "2(b) Residential (other) — elsewhere": [18, 35]
    "3 Office": [18, 45]
    "4 Shop and commercial": [18, 45]
    "5 Assembly and recreation — buildings primarily for disabled people": [9, 18]
    "5 Assembly and recreation — areas with seating in rows": [15, 32]
    "5 Assembly and recreation — elsewhere": [18, 45]
    "6 Industrial — normal hazard": [25, 45]
    "6 Industrial — higher hazard": [12, 25]
    "7 Storage and other non-residential — normal hazard": [25, 45]
    "7 Storage and other non-residential — higher hazard": [12, 25]
    "2–7 Place of special fire hazard": [9, 18]
    "2–7 Plant room or roof-top plant — distance within the room": [9, 35]
    "2–7 Plant room or roof-top plant — escape route not in open air (overall)": [18, 45]
    "2–7 Plant room or roof-top plant — escape route in open air (overall)": [60, 100]
  note_data_centres: "Data halls and plant areas are typically purpose group 7 or 'place of special fire hazard' / plant room rows — the fire strategy decides which. Do not assume."

minimum_escape_routes:
