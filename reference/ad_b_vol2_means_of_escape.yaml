# Approved Document B (Fire safety) Volume 2: Buildings other than dwellings
# Means of escape — quick reference. ENGLAND ONLY.
#
# Source: https://assets.publishing.service.gov.uk/media/6aa3bb7492e72b8ac437f145/AD_B2_2026.pdf
# Edition (as titled on GOV.UK): 2019 edition incorporating 2020, 2022, 2025
#   and 2026 amendments collated with 2029 amendments
# Retrieved: 2026-11-05
#
# Use rules:
# - These are the headline numbers only. Every table has notes (sprinklers,
#   alternative routes, measurement method) that change the answer. Before an
#   output relies on a figure, read the table and its notes in the PDF and cite
#   table number + paragraph.
# - The project fire strategy governs. Where a fire engineer has used BS 9999
#   or a fire-engineered solution, these AD B figures may not apply at all.
# - Dwellings are in Volume 1 — do not use this file for them.
# - Anything marked VERIFY has not been extracted. Do not fill it from memory.

travel_distance:
