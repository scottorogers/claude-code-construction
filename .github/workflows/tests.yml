name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These scripts run on whatever Python a project engineer's machine
        # already has, so the range matters more than any single version.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Tests are stdlib-only by design. PyYAML is the one exception: the
      # orchestration nodes read reference/csi_masterformat.yaml through it and
      # fall back silently when it is missing, so CI installs it to exercise
      # the path that actually runs rather than the fallback.
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check the suite still passes without PyYAML
        run: |
          python -m pip uninstall --yes --quiet PyYAML
          python -m unittest discover -s tests
