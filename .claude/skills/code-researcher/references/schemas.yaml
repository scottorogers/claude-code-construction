# Code Researcher Output Schemas — UK
# JIT-loaded per phase step — see SKILL.md for when each is used
# Each section is delimited and named for reference from SKILL.md
#
# Worked values below are FORMAT EXAMPLES for a UK LV electrical scope.
# Bracketed values like [n] and anything marked VERIFY are placeholders —
# never copy them into a real output. Every citation in a real output must
# trace to reference/ (with its source), a document fetched in the session,
# or the project documents.

# ═══════════════════════════════════════════════════════════════
# PHASE 1a — Project Context
# Write to: .construction/code_research/project_context.yaml
# ═══════════════════════════════════════════════════════════════
project_context:
  project_name: ""
  location:
    address: ""
    town: ""
    postcode: ""
    nation: ""                # England | Wales | Scotland | Northern Ireland — decides the regime
    local_authority: ""
  building_use: ""            # from fire strategy / Preliminaries
  purpose_groups: []          # AD B purpose group(s) as stated in the fire strategy, e.g. ["3 Office", "7 Storage"]
  higher_risk_building: null  # true | false | unknown — Building Safety Act 2022 regime
  project_type: ""            # new build | refurbishment | extension | material change of use | fit-out (CAT A / CAT B)
  storeys: 0
  top_storey_height_m: null   # as stated in the fire strategy — do not measure
  gross_internal_area_m2: 0
  sprinklered: null           # true | false | partial | unknown
  evacuation_strategy: ""     # simultaneous | phased | stay put | other — from fire strategy
  application_date: ""        # building control application / initial notice date — decides AD versions via transitional provisions
  building_control:
    route: ""                 # local authority | registered building control approver | Building Safety Regulator
    body: ""
    contact: ""               # if found in docs
  fire_engineer: ""           # author of fire strategy, if named

# ═══════════════════════════════════════════════════════════════
# PHASE 1b — Scope Definition
# Write to: .construction/code_research/scope_definition.yaml
# ═══════════════════════════════════════════════════════════════
scope_definition:
  research_question: "Are there regulatory or standards requirements for the LV installation we haven't addressed?"
  target_scope:
    spec_sections:
      - "Ss_70_30_45"            # primary section (Low-voltage systems)
      - "Ss_70_30_10"            # related sections if relevant (Cable management systems)
    drawing_sheets: []           # specific drawings if named (container IDs + revision)
    systems: []                  # systems if question is system-based
    scope_packages: ["Electrical package"]
  engineer_scopes: []            # all packages the engineer manages

  research_topics:
    # Generated from the target scope and project context — not hardcoded
    - slug: ""
      title: ""
      description: ""
      driven_by: ""  # what about the scope triggers this topic

# ═══════════════════════════════════════════════════════════════
# PHASE 2b — Pass 1 Project Inventory
# Write to: .construction/code_research/pass1_project_inventory.yaml
# ═══════════════════════════════════════════════════════════════
pass1_project_inventory:
  source_documents_read:
    - path: "specs/Ss_70_30_45 - Low-voltage systems.pdf"
      type: "spec_section"
      section: "Ss_70_30_45"
      pages_read: "all"

  code_citations_found:
    - citation: "BS 7671"
      context: "General requirement for installation — Ss_70_30_45 clause [n]"
      edition_specified: null          # null = no edition stated → becomes a gap candidate
      how_cited: "installation standard"

    - citation: "BS 5266-1"
      context: "Emergency lighting design — Ss_70_80 clause [n]"
      edition_specified: "[as printed in spec]"
      how_cited: "design standard"

  requirements_stated:
    - topic: "installer competence"
      requirement: "[as written in the spec]"
      source: "Ss_70_30_45 clause [n]"
      code_basis: null  # project-imposed requirement, not regulation-derived

    - topic: "cable reaction to fire (CPR Euroclass)"
      requirement: null  # NOT FOUND in spec — becomes a potential gap
      source: null
      code_basis: null
      note: "No Euroclass stated for cables in Ss_70_30_45 or related sections"

  topics_not_addressed:
    # Pre-populate during extraction — anything you expect in a section of
    # this type but didn't find
    - "BS 7671 edition"
    - "cable CPR Euroclass"
    - "fire-stopping of containment penetrations"

# ═══════════════════════════════════════════════════════════════
# PHASE 2c — Pass 1 Summary (flat inventory for gap diffing)
# Write to: .construction/code_research/pass1_summary.yaml
# ═══════════════════════════════════════════════════════════════
pass1_summary:
  topics_addressed:
    emergency_lighting_design:
      addressed: true
      by: "BS 5266-1 cited in Ss_70_80 clause [n]"
      gap_risk: low

    bs7671_edition:
      addressed: false
      by: null
      gap_risk: high    # edition changes requirements; contract may fix it

    cable_cpr_euroclass:
      addressed: false
      by: null
      gap_risk: medium  # fire strategy may set this globally

# ═══════════════════════════════════════════════════════════════
# PHASE 3a — Regime and Applicable Editions
# Write to: .construction/code_research/jurisdiction.yaml
# ═══════════════════════════════════════════════════════════════
jurisdiction:
  nation: ""                  # England | Wales | Scotland | Northern Ireland
  jurisdiction: ""            # local authority / building control body
  higher_risk_building: null
  adopted_codes:
    building_regulations:
      name: ""                # e.g. "The Building Regulations 2010" (England)
      citation: ""            # e.g. "SI 2010/2214"
      source: ""              # URL where verified

    approved_documents:
      # One entry per AD relevant to the scope. Version decided by
      # transitional provisions + application date — record both.
      - document: ""          # e.g. "Approved Document B Volume 2"
        edition: ""           # as titled on GOV.UK
        transitional_note: ""
        source: ""

    electrical:
      standard: "BS 7671"
      edition_current: "BS 7671:2018+A4:2026"   # reference/uk_regulations.yaml
      edition_in_contract: ""                    # what the spec/contract names
      source: ""

    referenced_standards:
      # Standards called up by the ADs, spec or fire strategy
      - name: ""              # e.g. "BS 5839-1"
        edition: ""           # from the spec — "not stated" is a finding
        called_up_by: ""      # e.g. "fire strategy section [x]"

  confidence: ""          # confirmed | inferred | uncertain
  confidence_notes: ""

# ═══════════════════════════════════════════════════════════════
# PHASE 3b — Per-Topic Research Findings
# Write to: .construction/code_research/topics/{slug}.yaml
# ═══════════════════════════════════════════════════════════════
topic_findings:
  topic: "BS 7671 edition"
  research_findings:
    - code: "BS 7671"
      section: null
      requirement: "Current designation is BS 7671:2018+A4:2026. IET states the BS 7671:2018+A2:2022 transition period ended on 15 October 2026."
      specific_to_this_scope: true
      edition_confirmed: true
      source_url: "https://electrical.theiet.org/bs-7671-18th-edition-wiring-regulations/ensure-you-are-up-to-date-with-bs-7671/"

    - code: "BS 7671"
      section: "[VERIFY — regulation number only from the user's licensed copy]"
      requirement: "[VERIFY]"
      specific_to_this_scope: true
      edition_confirmed: false
      source_url: ""
      note: "Clause text is paywalled. Record the topic, leave the regulation number for the user to confirm."

  applicable_test_standards: []

  gaps_identified:
    - "Spec cites BS 7671 with no edition"

# ═══════════════════════════════════════════════════════════════
# PHASE 4a — Gap Analysis
# Write to: .construction/code_research/gap_analysis.yaml
# ═══════════════════════════════════════════════════════════════
gap_analysis:
  gaps:
    - id: "GAP-001"
      topic: "BS 7671 edition"
      severity: HIGH
      confidence: confirmed

      code_requirement:
        code: "BS 7671:2018+A4:2026 (current — reference/uk_regulations.yaml)"
        text: "Edition the installation must be designed, installed and certified to."

      project_status:
        addressed: false
        in_documents: null
        note: "Ss_70_30_45 clause [n] cites 'BS 7671' with no edition."

      recommended_action: "Raise TQ: confirm the BS 7671 edition the design and certification are to. If A2:2022 is intended, confirm the design date supports it."

      engineer_action_required: true
      pe_decision_required: true   # designer must confirm

    - id: "GAP-002"
      topic: "Cable CPR Euroclass"
      severity: MEDIUM
      confidence: needs_review

      code_requirement:
        code: "[Fire strategy section / BS 7671 — VERIFY]"
        text: "[Requirement as read from the source]"

      project_status:
        addressed: false
        in_documents: null
        note: "No Euroclass stated for cable types in Ss_70_30_45."

      recommended_action: "Check the fire strategy; if silent, raise TQ for the Euroclass required on escape routes and in voids."

      engineer_action_required: true
      pe_decision_required: true

  already_addressed:
    - topic: "Emergency lighting design"
      addressed_by: "BS 5266-1 cited in Ss_70_80 clause [n]"
      confidence: confirmed

  uncertain:
    - topic: "Approved Document version"
      note: "Building control application date not found; cannot confirm which AD B version applies under its transitional provisions."
      recommended_action: "Ask the client / building control for the application or initial notice date."
