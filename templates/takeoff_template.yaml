# Quantity takeoff item template
# Array of these objects is passed to the QTO export.

# Each item:
#   category: Uniclass group or custom grouping
#   description: What the item is
#   sheet: Source drawing (ISO 19650 container ID + revision)
#   location: Where on the drawing (grid ref, room name/number)
#   quantity: Count or measurement value
#   unit: nr, m, m², m³, item, etc.
#   notes: Any observations, caveats, or cross-references
#   confidence: high / medium / low — how certain the vision identification is
#
# Values below are format examples only.

